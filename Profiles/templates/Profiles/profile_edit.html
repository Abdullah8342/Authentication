<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Edit Profile</title>
</head>
<body>
    <h1>Edit profile</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ user_form.as_p }}
        {{ profile_form.as_p }}
        <button type="submit">Save</button>
    </form>
    <p><a href="{% url 'profile_detail' %}">Back to profile</a></p>
</body>
</html>
